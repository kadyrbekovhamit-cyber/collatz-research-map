<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Research note · Collatz atlas</title><style>body{font:16px/1.65 system-ui;color:#253b4c;max-width:900px;margin:35px auto;padding:0 22px}a{color:#28629a;text-underline-offset:3px}h1{font:35px/1.25 Georgia,serif}h2{font-size:24px}h3{font-size:20px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f3f6f8;padding:20px;font:13px/1.8 ui-monospace,monospace;border-radius:5px}.note{font-size:12px;color:#768792;border-bottom:1px solid #dde5ea;padding-bottom:20px}.unattached{color:#89949c;text-decoration:underline dotted}p{overflow-wrap:anywhere}</style><a href="index.html">← Research atlas</a><p class="note">Original working note. Statements retain their hypotheses and dated audit status. Inclusion in this viewer is not external peer review or a full Collatz proof. Grey dotted references are outside this attached snapshot.</p><main id="paper"></main><script src="proofs.js"></script><script>
const key=new URLSearchParams(location.search).get('doc'),raw=window.ATLAS_PROOFS[key],paper=document.getElementById('paper');
const esc=s=>s.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
function inline(s){return esc(s).replace(/\[([^\]]+)\]\(([^)]+)\)/g,(_,label,href)=>{const clean=href.split('#')[0],base=clean.split('/').pop();if(window.ATLAS_PROOFS[base])return '<a href="report.html?doc='+encodeURIComponent(base)+'">'+label+'</a>';if(/^https?:\/\//.test(href))return '<a target="_blank" rel="noopener" href="'+href+'">'+label+' ↗</a>';return '<span class="unattached" title="Reference outside this snapshot">'+label+'</span>'})}
if(!raw){paper.textContent='This note is not attached to this snapshot.'}else{document.title=key+' · Collatz atlas';let out='',buffer=[],code=false;const flush=()=>{if(buffer.length){out+='<pre>'+inline(buffer.join('\n'))+'</pre>';buffer=[]}};for(const line of raw.split('\n')){if(line.startsWith('```')){flush();code=!code;continue}const h=!code&&line.match(/^(#{1,3}) (.+)/);if(h){flush();out+='<h'+h[1].length+'>'+inline(h[2])+'</h'+h[1].length+'>'}else buffer.push(line)}flush();paper.innerHTML=out}
</script></html>
